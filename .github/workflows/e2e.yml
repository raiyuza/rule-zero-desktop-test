# Rule Zero desktop: end-to-end test of install -> self-update -> uninstall on a fresh GitHub Windows runner.
# Lives in the public test feed repo (raiyuza/rule-zero-desktop-test), next to e2e-update.ps1 at the repo root.
# Source of both files: Inre4lity/rule-zero desktop/scripts/e2e/feed-repo/ and desktop/scripts/e2e-update.ps1 (copy them
# together; the contract is docs/plans/2026-11-26-desktop-self-update.md, "End-to-end test").
#
# Needs releases v<from_version> and v<to_version> in this repo (installer, .blockmap, .sig, latest.yml, SHA256SUMS.txt),
# with v<to_version> the latest normal (non pre-release) release. The tamper step needs a repo whose latest release is
# v<tamper_version> with a deliberately wrong .sig (see the script's help).
#
# Uncertain until the first run: GitHub-hosted Windows runners run the job in an interactive desktop session as
# runneradmin, so an Electron window can open (Electron/Playwright suites do this); the app has no GPU there and uses
# software rendering. If CloseMainWindow finds no window, the script records a FAIL and kills the app.
name: desktop e2e

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Version to install first (e.g. 0.2.2)
        required: true
        type: string
      to_version:
        description: Version it must update itself to (the latest release here)
        required: true
        type: string
      mode:
        description: OnQuit (install when the app closes), WhenReady (install and relaunch at once), Both, or none (skip)
        required: true
        default: Both
        type: choice
        options: [Both, OnQuit, WhenReady, none]
      tamper_version:
        description: Optional. Version of the release with a wrong .sig (the latest release of tamper_repo)
        required: false
        default: ''
        type: string
      tamper_repo:
        description: Optional. owner/name holding the tampered release (default this repo)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Inputs go through the environment, never into the script text.
      E2E_REPO: ${{ github.repository }}
      E2E_FROM: ${{ inputs.from_version }}
      E2E_TO: ${{ inputs.to_version }}
      E2E_MODE: ${{ inputs.mode }}
      E2E_TAMPER_VERSION: ${{ inputs.tamper_version }}
      E2E_TAMPER_REPO: ${{ inputs.tamper_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Self-test (read-only)
        shell: powershell
        run: .\e2e-update.ps1 -SelfTest -Repo $env:E2E_REPO

      - name: Install, update, uninstall
        if: inputs.mode != 'none'
        shell: powershell
        run: |
          .\e2e-update.ps1 -Repo $env:E2E_REPO -FromVersion $env:E2E_FROM -ToVersion $env:E2E_TO `
            -Mode $env:E2E_MODE -WorkDir (Join-Path $env:RUNNER_TEMP 'e2e/update') -WindowStyle Normal -TimeoutSec 1200

      - name: Tampered signature is refused
        if: always() && inputs.tamper_version != ''
        shell: powershell
        run: |
          $tr = $env:E2E_TAMPER_REPO
          if (-not $tr) { $tr = $env:E2E_REPO }
          # Starts from to_version: the newest good build, so the tampered release is the newer one.
          .\e2e-update.ps1 -TamperTest -Repo $env:E2E_REPO -FromVersion $env:E2E_TO -TamperRepo $tr `
            -TamperVersion $env:E2E_TAMPER_VERSION -WorkDir (Join-Path $env:RUNNER_TEMP 'e2e/tamper') -WindowStyle Normal -TimeoutSec 1200

      - name: Job summary
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'e2e') -Recurse -Filter report.md -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ inputs.from_version }}-to-${{ inputs.to_version }}-${{ github.run_id }}
          # Reports and logs only; the downloaded installers stay behind.
          path: |
            ${{ runner.temp }}/e2e/**/report.*
            ${{ runner.temp }}/e2e/**/*.log
          if-no-files-found: warn
          retention-days: 14
